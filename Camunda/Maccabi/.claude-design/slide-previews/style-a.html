<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A: Bold Signal</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Satoshi',sans-serif;background:#0a0f1c;color:#fff;display:flex;align-items:center;justify-content:center}
.slide{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:clamp(2rem,4vw,4rem)}
.slide::before{content:'';position:absolute;top:-20%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(255,102,0,0.15) 0%,transparent 70%);pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,102,0,0.08) 0%,transparent 70%);pointer-events:none}
.logos{display:flex;align-items:center;gap:clamp(1rem,3vw,2.5rem);margin-bottom:clamp(1.5rem,3vh,3rem);opacity:0;animation:fadeUp .8s .2s forwards}
.logos img{height:clamp(36px,5vw,56px);object-fit:contain}
.divider{width:2px;height:clamp(30px,4vw,48px);background:rgba(255,255,255,0.2);border-radius:1px}
h1{font-family:'Clash Display',sans-serif;font-size:clamp(2rem,6vw,4.5rem);font-weight:700;text-align:center;line-height:1.1;margin-bottom:clamp(.75rem,2vh,1.5rem);opacity:0;animation:fadeUp .8s .4s forwards}
h1 span{color:#FF6600;display:block}
.subtitle{font-size:clamp(.9rem,2vw,1.3rem);color:rgba(255,255,255,0.6);text-align:center;font-weight:400;opacity:0;animation:fadeUp .8s .6s forwards;max-width:600px}
.tag{display:inline-block;background:rgba(255,102,0,0.15);border:1px solid rgba(255,102,0,0.3);color:#FF6600;padding:.4em 1.2em;border-radius:100px;font-size:clamp(.7rem,1.2vw,.9rem);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:clamp(1rem,2vh,2rem);opacity:0;animation:fadeUp .8s .8s forwards}
.style-label{position:fixed;bottom:2rem;right:2rem;font-size:.75rem;color:rgba(255,255,255,0.3);letter-spacing:.1em;text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<section class="slide">
<div class="logos">
<h1>Camunda & BPMN<span>Introduction Workshop</span></h1>
<p class="subtitle">NG Workshop — Empowering Maccabi Healthcare with Process Orchestration</p>
<span class="tag">Partner Workshop</span>
</section>
<div class="style-label">Style A: Bold Signal</div>
</body>
</html>
