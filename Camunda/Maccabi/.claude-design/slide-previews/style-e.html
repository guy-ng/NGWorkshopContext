<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style E: Circuit Board</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#08090d;color:#e8e8e8;display:flex;align-items:center;justify-content:center}
.slide{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:clamp(2rem,4vw,4rem)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,102,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,102,0,.04) 1px,transparent 1px);background-size:clamp(30px,5vw,60px) clamp(30px,5vw,60px)}
.scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,102,0,.4),transparent);animation:scan 4s linear infinite}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(1rem,2vh,2rem)}
.logos{display:flex;align-items:center;gap:clamp(1rem,2.5vw,2rem);opacity:0;animation:glitch .6s .2s forwards}
.logos img{height:clamp(30px,4vw,46px);object-fit:contain}
.mono-sep{font-family:'JetBrains Mono',monospace;color:rgba(255,102,0,.5);font-size:clamp(.8rem,1.5vw,1.2rem)}
h1{font-size:clamp(2.5rem,7vw,5rem);font-weight:800;text-align:center;line-height:1.05;letter-spacing:-.03em;opacity:0;animation:glitch .6s .35s forwards}
h1 .accent{color:#FF6600;position:relative}
h1 .accent::after{content:'';position:absolute;bottom:-.1em;left:0;right:0;height:3px;background:#FF6600;border-radius:2px}
.mono-sub{font-family:'JetBrains Mono',monospace;font-size:clamp(.65rem,1.2vw,.85rem);color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:glitch .6s .5s forwards}
.tag-row{display:flex;gap:.5rem;opacity:0;animation:glitch .6s .65s forwards}
.tag{font-family:'JetBrains Mono',monospace;font-size:clamp(.6rem,.9vw,.75rem);padding:.3em .8em;border:1px solid rgba(255,102,0,.25);border-radius:4px;color:rgba(255,102,0,.7);background:rgba(255,102,0,.05)}
.style-label{position:fixed;bottom:2rem;right:2rem;font-size:.75rem;color:rgba(255,255,255,0.15);letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;z-index:10}
@keyframes glitch{0%{opacity:0;transform:translateY(15px) skewX(-2deg)}60%{transform:translateY(-2px) skewX(1deg)}100%{opacity:1;transform:translateY(0) skewX(0)}}
@keyframes scan{0%{top:0}100%{top:100%}}
</style>
</head>
