<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style B: Bold Dark - תצוגה מקדימה</title>

    <!-- Heebo for Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* ===========================================
           STYLE B: BOLD DARK
           Dark background, vibrant green accents
           High contrast, dramatic entrance
           =========================================== */

        :root {
            /* Brand Colors - Dark Mode */
            --primary: #8ABF3B;
            --primary-light: #B6D66B;
            --primary-glow: rgba(138, 191, 59, 0.4);
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --dark: #3E352B;
            --text-white: #ffffff;
            --text-muted: #a0a0b0;
            --border-dark: #2a2a3a;

            /* Typography */
            --font-primary: 'Heebo', sans-serif;
            --title-size: clamp(2.5rem, 9vw, 6rem);
            --subtitle-size: clamp(1rem, 2.5vw, 1.5rem);

            /* Spacing */
            --slide-padding: clamp(2rem, 5vw, 5rem);

            /* Animation */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-dark);
            color: var(--text-white);
        }

        /* ===========================================
           SLIDE CONTAINER
           =========================================== */
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--slide-padding);
            position: relative;
            overflow: hidden;
        }

        /* ===========================================
           BACKGROUND EFFECTS
           =========================================== */
        .glow-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            z-index: 0;
        }

        .glow-orb-1 {
            top: -20%;
            right: -10%;
            background: var(--primary);
            animation: pulse 8s ease-in-out infinite;
        }

        .glow-orb-2 {
            bottom: -30%;
            left: -15%;
            background: var(--primary-light);
            animation: pulse 10s ease-in-out infinite reverse;
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(138, 191, 59, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 191, 59, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        /* ===========================================
           CONTENT CARD
           =========================================== */
        .content-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(145deg, rgba(18, 18, 26, 0.9), rgba(10, 10, 15, 0.95));
            border: 1px solid rgba(138, 191, 59, 0.2);
            border-radius: 32px;
            padding: clamp(2rem, 5vw, 4rem);
            text-align: center;
            max-width: 800px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 60px rgba(138, 191, 59, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            animation: cardIn 1s var(--ease-out-expo) 0.3s forwards;
        }

        .logo {
            width: clamp(100px, 20vw, 160px);
            height: auto;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 0 30px var(--primary-glow));
            opacity: 0;
            transform: scale(0.8);
            animation: logoIn 0.8s var(--ease-out-expo) 0.5s forwards;
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        h1 {
            font-size: var(--title-size);
            font-weight: 900;
            color: var(--text-white);
            line-height: 1.05;
            margin-bottom: 1.5rem;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: var(--subtitle-size);
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ===========================================
           CORNER ACCENTS
           =========================================== */
        .corner-accent {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid var(--primary);
            opacity: 0;
            animation: cornerIn 0.8s var(--ease-out-expo) 0.8s forwards;
        }

        .corner-top-right {
            top: 30px;
            right: 30px;
            border-bottom: none;
            border-left: none;
            border-radius: 0 16px 0 0;
        }

        .corner-bottom-left {
            bottom: 30px;
            left: 30px;
            border-top: none;
            border-right: none;
            border-radius: 0 0 0 16px;
        }

        /* ===========================================
           NEON LINE
           =========================================== */
        .neon-accent {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary));
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary-glow);
            opacity: 0;
            animation: lineSlide 0.8s var(--ease-out-expo) 1s forwards;
        }

        /* ===========================================
           ANIMATIONS
           =========================================== */
        @keyframes cardIn {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes logoIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes cornerIn {
            to {
                opacity: 0.6;
            }
        }

        @keyframes lineSlide {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.4; }
        }

        /* ===========================================
           STYLE LABEL
           =========================================== */
        .style-label {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--primary);
            color: var(--bg-dark);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 100;
        }

        /* ===========================================
           RESPONSIVE
           =========================================== */
        @media (max-height: 600px) {
            .content-card {
                padding: clamp(1.5rem, 3vw, 2.5rem);
                border-radius: 24px;
            }
            .logo {
                width: clamp(60px, 15vw, 100px);
                margin-bottom: 1rem;
            }
            .corner-accent {
                display: none;
            }
            .neon-accent {
                bottom: 30px;
                right: 30px;
            }
        }

        @media (max-width: 600px) {
            .corner-accent {
                width: 60px;
                height: 60px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
            }
            .glow-orb {
                animation: none;
            }
        }
    </style>
</head>
